services:
  app:
    image: pizzeria-app:local
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pizzeria_app
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    environment:
      APP_ENV: dev
      APP_DEBUG: "0"
      DATABASE_URL: mysql://app:app@db:3306/pizzeria?charset=utf8mb4
      QUEUE_ALERT_THRESHOLD: 5
    depends_on:
      db:
        condition: service_healthy

  worker:
    image: pizzeria-app:local
    container_name: pizzeria_worker
    working_dir: /var/www/html
    command:
      - sh
      - -lc
      - while true; do cd /var/www/html && php bin/console app:process-next-order >> /var/www/html/var/log/worker.log 2>&1; sleep 600; done
    volumes:
      - ./:/var/www/html
    environment:
      APP_ENV: dev
      APP_DEBUG: "0"
      DATABASE_URL: mysql://app:app@db:3306/pizzeria?charset=utf8mb4
      QUEUE_ALERT_THRESHOLD: 5
    depends_on:
      app:
        condition: service_started
      db:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    container_name: pizzeria_nginx
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  db:
    image: mysql:8.4
    container_name: pizzeria_db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: pizzeria
      MYSQL_USER: app
      MYSQL_PASSWORD: app
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
